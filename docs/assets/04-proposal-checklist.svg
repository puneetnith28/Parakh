<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)" />

  <rect x="50" y="30" width="1100" height="640" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <circle cx="85" cy="65" r="7" fill="#ef4444" />
  <circle cx="107" cy="65" r="7" fill="#f59e0b" />
  <circle cx="129" cy="65" r="7" fill="#10b981" />
  <text x="600" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle" font-weight="500">Parakh — Actionable Gap Plan &amp; Evidence-Backed Proposal Kit</text>

  <!-- Left Column: Gap Checklist -->
  <text x="100" y="125" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold">Actionable Gap Checklist</text>
  <text x="100" y="150" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Items requiring client clarification or rapid sprint spike:</text>

  <rect x="100" y="170" width="480" height="130" rx="10" fill="#020617" stroke="#334155" stroke-width="1" />
  <text x="120" y="198" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">❓ Clarification: FR-04 API Rate Limiting</text>
  <text x="120" y="222" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">"Do you require distributed Redis token-bucket limiting across multiple instances,</text>
  <text x="120" y="242" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">or is single-node in-memory rate limiting sufficient for initial MVP launch?"</text>
  <text x="120" y="278" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">Suggested Action: Propose Redis cluster adapter as an optional Phase 2 milestone.</text>

  <rect x="100" y="320" width="480" height="130" rx="10" fill="#020617" stroke="#334155" stroke-width="1" />
  <text x="120" y="348" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">⚡ Action Item: FR-06 Kubernetes Helm Chart</text>
  <text x="120" y="372" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">"Repository contains Dockerfile but lacks Helm charts. Recommend adding a 1-day</text>
  <text x="120" y="392" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">scaffolding task to draft production Kubernetes manifests with ingress routing."</text>
  <text x="120" y="428" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">Estimated Effort: 6 hours | Risk Level: Low</text>

  <!-- Right Column: Proposal Draft Kit -->
  <text x="620" y="125" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold">Evidence-Grounded Proposal Draft</text>
  <text x="620" y="150" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Copy-pasteable proposal with hyperlinked code proofs:</text>

  <rect x="620" y="170" width="480" height="420" rx="10" fill="#020617" stroke="#0284c7" stroke-width="1" />
  <text x="640" y="205" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13">Dear Hiring Team,</text>
  <text x="640" y="235" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">I reviewed your Enterprise Billing RFP. Rather than asking you to take</text>
  <text x="640" y="255" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">my word for it, here is verifiable proof from my open-source work:</text>

  <rect x="640" y="275" width="440" height="55" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
  <text x="655" y="297" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">✓ React 18 &amp; TypeScript Architecture:</text>
  <text x="655" y="317" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">Verified in App.tsx (12 typed components, 0 any types)</text>

  <rect x="640" y="340" width="440" height="55" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
  <text x="655" y="362" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">✓ JWT Session &amp; RBAC Security:</text>
  <text x="655" y="382" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">Verified in auth.ts:L34-52 (Backed by passing test suite)</text>

  <text x="640" y="425" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Regarding Kubernetes deployment, I can implement your Helm manifests</text>
  <text x="640" y="445" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">during Sprint 1. Looking forward to discussing this in detail.</text>

  <rect x="640" y="525" width="200" height="40" rx="8" fill="#0284c7" />
  <text x="740" y="550" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle" font-weight="bold">📋 Copy Proposal Text</text>

  <rect x="860" y="525" width="220" height="40" rx="8" fill="#10b981" />
  <text x="970" y="550" fill="#020617" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle" font-weight="bold">📄 Export Audit Report</text>
</svg>
