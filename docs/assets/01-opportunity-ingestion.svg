<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="skyBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)" />

  <!-- Window Header -->
  <rect x="50" y="30" width="1100" height="640" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <circle cx="85" cy="65" r="7" fill="#ef4444" />
  <circle cx="107" cy="65" r="7" fill="#f59e0b" />
  <circle cx="129" cy="65" r="7" fill="#10b981" />
  <text x="600" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" text-anchor="middle" font-weight="500">Parakh — Opportunity Ingestion &amp; Requirement Extraction</text>

  <!-- Brand / Header -->
  <text x="100" y="130" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="bold">Parakh (परख)</text>
  <text x="100" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Evidence-Grounded Developer Capability Assessment Platform</text>
  <rect x="980" y="115" width="120" height="32" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="1040" y="136" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle" font-weight="600">● Engine Online</text>

  <!-- Instant Demo Banner -->
  <rect x="100" y="180" width="1000" height="60" rx="12" fill="#082f49" fill-opacity="0.5" stroke="#0284c7" stroke-width="1" />
  <circle cx="135" cy="210" r="14" fill="#0284c7" fill-opacity="0.3" />
  <text x="135" y="215" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" text-anchor="middle">✨</text>
  <text x="165" y="205" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Instant Demo Scenario</text>
  <text x="165" y="224" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Pre-populate realistic SaaS client brief &amp; reference repository with one click.</text>
  <rect x="940" y="195" width="140" height="30" rx="6" fill="#0284c7" />
  <text x="1010" y="215" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle" font-weight="600">Load Sample Demo</text>

  <!-- Brief Input Box -->
  <text x="100" y="275" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Client Opportunity Brief / RFP Description</text>
  <rect x="100" y="290" width="1000" height="150" rx="10" fill="#020617" stroke="#334155" stroke-width="1" />
  <text x="120" y="325" fill="#64748b" font-family="ui-monospace, monospace" font-size="13"># Project Brief: Modern Full-Stack Enterprise Billing &amp; Subscription Engine</text>
  <text x="120" y="350" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="13">- FR-01: Responsive Next.js / React 18 SPA with clean TypeScript boundaries</text>
  <text x="120" y="375" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="13">- FR-02: JWT session handling with refresh token rotation and RBAC</text>
  <text x="120" y="400" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="13">- FR-03: Relational persistence with ACID compliance, schema migrations, and indexing</text>

  <!-- Repository Input Box -->
  <text x="100" y="475" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Public GitHub Repository URL</text>
  <rect x="100" y="490" width="1000" height="50" rx="10" fill="#020617" stroke="#334155" stroke-width="1" />
  <text x="125" y="521" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="14">https://github.com/puneetnith28/Parakh</text>

  <!-- Action Button -->
  <rect x="880" y="570" width="220" height="46" rx="10" fill="#10b981" />
  <text x="990" y="598" fill="#020617" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" text-anchor="middle" font-weight="bold">⚡ Analyze Capability</text>
</svg>
